<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access | QuizPlatform AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        select option {
            background-color: #0f172a;
            color: white;
        }

        .btn-glow {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s ease;
        }
        .btn-glow:hover::before { left: 100%; }
        .btn-glow:hover {
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative overflow-hidden px-4 py-12 sm:px-6 lg:px-8">

<canvas id="particleCanvas" class="absolute inset-0 z-0 opacity-80"></canvas>

<div class="absolute top-0 right-1/4 w-96 h-96 bg-indigo-500/20 rounded-full mix-blend-screen filter blur-[100px] animate-pulse z-0 pointer-events-none"></div>
<div class="absolute bottom-0 left-1/4 w-96 h-96 bg-purple-500/20 rounded-full mix-blend-screen filter blur-[100px] animate-pulse z-0 pointer-events-none" style="animation-delay: 2s;"></div>

<div class="w-full max-w-[460px] relative z-10 flex flex-col items-center animate-[fadeIn_0.8s_ease-out]">

    <div class="flex items-center gap-3 text-white font-extrabold text-3xl tracking-tight mb-6">
        <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white shadow-[0_0_30px_rgba(99,102,241,0.4)]">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        Quiz.AI
    </div>

    <div class="w-full glass-card p-8 sm:p-10 rounded-[2rem]">

        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-white">Candidate Registration</h2>
            <p class="text-slate-400 mt-2 font-medium text-sm">Create an identity to access the network.</p>
        </div>

        <div id="errorMessage" class="hidden mb-6 bg-red-500/10 border border-red-500/20 p-4 rounded-xl flex items-start backdrop-blur-md">
            <i class="bi bi-shield-x text-red-400 mt-0.5 mr-3 text-lg"></i>
            <p id="errorText" class="text-sm text-red-200 font-medium"></p>
        </div>
        <div id="successMessage" class="hidden mb-6 bg-green-500/10 border border-green-500/20 p-4 rounded-xl flex items-start backdrop-blur-md">
            <i class="bi bi-check-circle-fill text-green-400 mt-0.5 mr-3 text-lg"></i>
            <p class="text-sm text-green-200 font-medium">Account initialized successfully! Redirecting to uplink...</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label for="name" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Candidate Name</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-indigo-400 text-slate-500">
                        <i class="bi bi-person-badge"></i>
                    </div>
                    <input type="text" id="name" required
                           class="w-full pl-11 pr-4 py-3.5 rounded-xl glass-input text-sm placeholder-slate-600"
                           placeholder="e.g. John Doe">
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-indigo-400 text-slate-500">
                        <i class="bi bi-envelope-at"></i>
                    </div>
                    <input type="email" id="email" required
                           class="w-full pl-11 pr-4 py-3.5 rounded-xl glass-input text-sm placeholder-slate-600"
                           placeholder="rohit@example.com">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-indigo-400 text-slate-500">
                            <i class="bi bi-key"></i>
                        </div>
                        <input type="password" id="password" required minlength="6"
                               class="w-full pl-11 pr-4 py-3.5 rounded-xl glass-input text-sm placeholder-slate-600"
                               placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <label for="role" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Clearance Level</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-indigo-400 text-slate-500">
                            <i class="bi bi-diagram-3"></i>
                        </div>
                        <select id="role" required class="w-full pl-11 pr-10 py-3.5 rounded-xl glass-input text-sm appearance-none cursor-pointer text-slate-300">
                            <option value="" disabled selected class="text-slate-500">Select Role</option>
                            <option value="student">Student User</option>
                            <option value="admin">Admin / Teacher</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-500">
                            <i class="bi bi-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" id="registerBtn"
                    class="w-full flex items-center justify-center gap-2 py-4 px-4 mt-6 rounded-xl btn-glow text-sm font-bold text-white uppercase tracking-wider shadow-lg">
                <span>Initialize Account</span>
                <i class="bi bi-fingerprint text-xl"></i>
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-slate-400 font-medium border-t border-white/5 pt-6">
            Identity already verified?
            <a href="index.html" class="font-bold text-indigo-400 hover:text-indigo-300 transition-colors ml-1">Return to Login</a>
        </p>
    </div>

    <div class="mt-8 text-slate-600 text-[11px] uppercase tracking-[0.2em] font-bold">
        © 2026 Rohit Bisht. Secure Network.
    </div>
</div>

<script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles;
    let mouse = { x: null, y: null, radius: 150 };

    window.addEventListener('mousemove', function(event) {
        mouse.x = event.x; mouse.y = event.y;
    });
    window.addEventListener('mouseout', function() {
        mouse.x = null; mouse.y = null;
    });

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        const particleCount = (width * height) / 12000;
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }
    }

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 2 + 1; // Brighter/larger
            this.speedX = Math.random() * 1 - 0.5;
            this.speedY = Math.random() * 1 - 0.5;
            this.color = `rgba(${Math.random() > 0.5 ? '99,102,241' : '168,85,247'}, ${Math.random() * 0.4 + 0.5})`; // Higher opacity
        }
        update() {
            this.x += this.speedX; this.y += this.speedY;
            if (this.x > width || this.x < 0) this.speedX *= -1;
            if (this.y > height || this.y < 0) this.speedY *= -1;
            if (mouse.x != null) {
                let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    const forceDirectionX = dx / distance; const forceDirectionY = dy / distance;
                    const force = (mouse.radius - distance) / mouse.radius;
                    this.x -= forceDirectionX * force * 2; this.y -= forceDirectionY * force * 2;
                }
            }
        }
        draw() {
            ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update(); particles[i].draw();
            for (let j = i; j < particles.length; j++) {
                let dx = particles[i].x - particles[j].x; let dy = particles[i].y - particles[j].y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 120) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(168, 85, 247, ${0.45 * (1 - distance/120)})`; // Brighter lines
                    ctx.lineWidth = 1.5; // Thicker lines
                    ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }
    window.addEventListener('resize', initCanvas);
    initCanvas(); animate();
</script>

<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>

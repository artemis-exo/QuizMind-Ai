server:
  port: 8080

spring:
  application:
    name: quiz-platform-backend

  data:
    mongodb:
      uri: mongodb://localhost:27017/quiz_platform

  jackson:
    serialization:
      write-dates-as-timestamps: false

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5-coder:1.5b
          temperature: 0.1 # Lowered to 0.1 for maximum JSON strictness

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.ai: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: quiz-platform-secret-key-should-be-long
  expiration: 3600000